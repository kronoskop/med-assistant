<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CliniCompass — клинический справочный ассистент</title>
<!-- Шрифты подключаются с CDN, но каждый стек имеет полный локальный запасной
     вариант: на машине без доступа в интернет теряется только гарнитура. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/ui/styles.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="side-org">
      <span class="side-mark" id="brand-mark"></span>
      <div class="side-org-text">
        <span class="side-org-name">CliniCompass</span>
        <span class="side-org-sub" data-t="orgShort"></span>
      </div>
    </div>

    <button class="side-new" id="new-chat"></button>

    <div class="side-history sc">
      <span class="side-label" data-t="historyLabel"></span>
      <div id="history-list"></div>
      <span class="side-hint" data-t="historyNote"></span>
    </div>

    <div class="side-foot">
      <div class="side-note strong">
        <span class="icon" data-icon="user-circle"></span>
        <span data-t="whoami"></span>
      </div>
      <div class="side-note">
        <span class="icon" data-icon="shield-check"></span>
        <span data-t="privacyNote"></span>
      </div>
      <button class="side-settings" id="settings-toggle" type="button">
        <span class="icon" data-icon="gear"></span>
        <span class="side-settings-label" data-t="settingsTitle"></span>
        <span class="side-settings-value" id="settings-lang"></span>
      </button>
    </div>

    <div class="settings-panel" id="settings-panel" hidden>
      <div class="settings-head">
        <span class="icon" data-icon="gear"></span>
        <span data-t="settingsTitle"></span>
      </div>
      <span class="settings-label" data-t="languageTitle"></span>
      <div class="settings-langs" id="lang-list"></div>
      <span class="settings-note" data-t="modelLangNote"></span>
    </div>
  </aside>

  <main class="main">
    <header class="head">
      <div class="head-id">
        <div class="head-title">
          <h1 data-t="botName"></h1>
          <span class="head-badge" data-t="protoNote"></span>
        </div>
        <div class="head-status">
          <span class="dot" id="status-dot" data-state="checking"></span>
          <span id="status-text"></span>
        </div>
      </div>

    </header>

    <div class="thread sc" id="thread">
      <div class="col" id="col"></div>
    </div>

    <div class="composer">
      <div class="composer-col">
        <div class="composer-row">
          <textarea id="input" rows="2"></textarea>
          <button class="send" id="send" type="button"></button>
          <button class="stop" id="stop" type="button" hidden></button>
        </div>
        <span class="composer-note" data-t="disclaimer"></span>
      </div>
    </div>
  </main>

</div>

<script src="/ui/data.js"></script>
<script src="/ui/topics.js"></script>
<script src="/ui/app.js"></script>
</body>
</html>
