[project]
name = "med-assistant"
version = "0.1.0"
description = "HTTP API медицинского ИИ-ассистента с локальной MedGemma в LM Studio"
requires-python = ">=3.12"
dependencies = [
    "axllm>=24.0.17",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic-settings>=2.5",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
